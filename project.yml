name: TokenUsageMonitor
options:
  bundleIdPrefix: me.andycao.app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 4MX24QZ69S
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO

targets:
  TokenUsageMonitor:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.andycao.app.tokenusagemonitor
        PRODUCT_NAME: TokenUsageMonitor
    info:
      path: App/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/TokenUsageMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - 4MX24QZ69S.group.me.andycao.app.tokenusagemonitor
    dependencies:
      - target: TokenUsageMonitorExtension

  TokenUsageMonitorExtension:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.andycao.app.tokenusagemonitor.widget
        PRODUCT_NAME: TokenUsageMonitorExtension
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/TokenUsageMonitorExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 4MX24QZ69S.group.me.andycao.app.tokenusagemonitor

  TokenUsageMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - App/Services
      - App/Providers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.andycao.app.tokenusagemonitor.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

schemes:
  TokenUsageMonitor:
    build:
      targets:
        TokenUsageMonitor: all
        TokenUsageMonitorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TokenUsageMonitorTests
