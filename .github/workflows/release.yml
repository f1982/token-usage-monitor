name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      WIDGET_BUNDLE_ID: ${{ vars.WIDGET_BUNDLE_ID }}
      APP_GROUP_IDENTIFIER: ${{ vars.APP_GROUP_IDENTIFIER }}
      CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
      CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
      APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
      WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_P8: ${{ secrets.APPLE_API_PRIVATE_KEY_P8 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen
          fi

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            APPLE_TEAM_ID APP_BUNDLE_ID WIDGET_BUNDLE_ID APP_GROUP_IDENTIFIER
            CERTIFICATE_PASSWORD CERTIFICATE_P12_BASE64
            APP_PROVISIONING_PROFILE_BASE64 WIDGET_PROVISIONING_PROFILE_BASE64
            APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY_P8
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "Missing release variable: $name" >&2; exit 1; }
          done

      - name: Import Developer ID certificate
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "Developer ID Application identity not found" >&2; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Install provisioning profiles
        shell: bash
        run: |
          set -euo pipefail
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"

          install_profile() {
            local base64_value="$1"
            local label="$2"
            local profile="$RUNNER_TEMP/${label}.provisionprofile"
            printf '%s' "$base64_value" | base64 --decode > "$profile"

            local uuid
            local name
            uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -o - -)"
            name="$(security cms -D -i "$profile" | plutil -extract Name raw -o - -)"
            [[ -n "$uuid" && -n "$name" ]] || {
              echo "Could not read $label provisioning profile metadata" >&2
              exit 1
            }
            cp "$profile" "$profiles_dir/$uuid.provisionprofile"
            printf '%s=%s\n' "${label}_PROVISIONING_PROFILE_SPECIFIER" "$name" >> "$GITHUB_ENV"
          }

          install_profile "$APP_PROVISIONING_PROFILE_BASE64" APP
          install_profile "$WIDGET_PROVISIONING_PROFILE_BASE64" WIDGET

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          xcodebuild \
            -project TokenUsageMonitor.xcodeproj \
            -scheme TokenUsageMonitor \
            -destination 'platform=macOS' \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive signed app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project TokenUsageMonitor.xcodeproj \
            -scheme TokenUsageMonitor \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/TokenUsageMonitor.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            APP_BUNDLE_ID="$APP_BUNDLE_ID" \
            WIDGET_BUNDLE_ID="$WIDGET_BUNDLE_ID" \
            APP_GROUP_IDENTIFIER="$APP_GROUP_IDENTIFIER" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            APP_PROVISIONING_PROFILE_SPECIFIER="$APP_PROVISIONING_PROFILE_SPECIFIER" \
            WIDGET_PROVISIONING_PROFILE_SPECIFIER="$WIDGET_PROVISIONING_PROFILE_SPECIFIER" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Create notarization API key
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if [[ "$APPLE_API_PRIVATE_KEY_P8" == -----BEGIN\ PRIVATE\ KEY-----* ]]; then
            printf '%s' "$APPLE_API_PRIVATE_KEY_P8" > "$key_path"
          else
            printf '%s' "$APPLE_API_PRIVATE_KEY_P8" | base64 --decode > "$key_path"
          fi
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$key_path" || {
            echo 'APPLE_API_PRIVATE_KEY_P8 is neither raw PEM nor valid Base64-encoded PEM' >&2
            exit 1
          }
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Notarize and staple app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/TokenUsageMonitor.xcarchive/Products/Applications/TokenUsageMonitor.app"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/TokenUsageMonitor-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/TokenUsageMonitor-notarize.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$app_path"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/TokenUsageMonitor-${RELEASE_VERSION}.zip"

      - name: Publish GitHub Release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION}"
          artifact="dist/TokenUsageMonitor-${RELEASE_VERSION}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$artifact" --clobber
          else
            gh release create "$tag" "$artifact" \
              --title "Token Usage Monitor ${RELEASE_VERSION}" \
              --generate-notes
          fi
